<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab Activity 4 | Advanced ES6+ &amp; Fetching Asynchronous Data</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Advanced ES6+ &amp; Fetching Asynchronous Data</h1>
    <p>Live posts pulled from the <a href="https://jsonplaceholder.typicode.com/posts" target="_blank" rel="noopener">JSONPlaceholder</a> <code>/posts</code> endpoint.</p>
  </header>

  <main>
    <section aria-labelledby="controls-heading">
      <h2 id="controls-heading">Controls</h2>
      <form id="search-form">
        <p>
          <label for="search-input">Search posts</label>
          <input type="search" id="search-input" name="search" placeholder="Filter by title or body...">
        </p>
      </form>
      <p>
        <button type="button" id="refresh-btn">Refresh Live Data</button>
        <button type="button" id="load-more-btn">Load More</button>
        <span id="status" role="status" aria-live="polite"></span>
      </p>
      <p id="stats"></p>
    </section>

    <section aria-labelledby="posts-heading">
      <h2 id="posts-heading">Posts</h2>
      <ul id="post-list"></ul>
    </section>
  </main>

  <footer>
    <p>Lab Activity 4: Advanced ES6+ &amp; Fetching Asynchronous Data</p>
  </footer>

  <script src="app.js" defer></script>
</body>
</html>
